<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="elec-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="gold-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow-e" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <ellipse cx="200" cy="245" rx="120" ry="20" fill="#000000" opacity="0.3" filter="blur(8px)" />
  <!-- Over-Ear Headphones -->
  <g filter="url(#glow-e)">
    <!-- Headband -->
    <path d="M120 160 C120 70 280 70 280 160" stroke="#312e81" stroke-width="22" stroke-linecap="round" fill="none" />
    <path d="M130 150 C130 85 270 85 270 150" stroke="url(#elec-neon)" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Left Ear Cup -->
    <rect x="95" y="140" width="38" height="75" rx="19" fill="#1e1b4b" stroke="url(#gold-ring)" stroke-width="4" />
    <ellipse cx="114" cy="177" rx="10" ry="24" fill="#0f172a" />
    <!-- Right Ear Cup -->
    <rect x="267" y="140" width="38" height="75" rx="19" fill="#1e1b4b" stroke="url(#gold-ring)" stroke-width="4" />
    <ellipse cx="286" cy="177" rx="10" ry="24" fill="#0f172a" />
  </g>
  <!-- Smartwatch in front -->
  <g filter="url(#glow-e)" transform="translate(160, 160)">
    <rect x="0" y="0" width="80" height="70" rx="20" fill="#0f172a" stroke="#818cf8" stroke-width="3" />
    <circle cx="40" cy="35" r="22" fill="#1e1b4b" />
    <circle cx="40" cy="35" r="16" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="70 30" />
    <circle cx="40" cy="35" r="3" fill="#38bdf8" />
  </g>
  <!-- Sparkles -->
  <circle cx="85" cy="80" r="3" fill="#a5b4fc" />
  <circle cx="310" cy="90" r="3.5" fill="#a5b4fc" />
</svg>