<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="lamp-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="ceramic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow-h" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <ellipse cx="200" cy="245" rx="120" ry="20" fill="#000000" opacity="0.3" filter="blur(8px)" />
  <!-- Ceramic Vase -->
  <g filter="url(#glow-h)">
    <path d="M120 230 C110 180 150 160 145 130 C145 120 165 120 165 130 C160 160 200 180 190 230 Z" fill="url(#ceramic)" />
    <!-- Plant stem coming out of vase -->
    <path d="M155 125 Q130 90 110 95 Q140 100 155 125" fill="#10b981" />
    <path d="M155 120 Q170 80 190 85 Q170 95 155 120" fill="#059669" />
  </g>
  <!-- Modern Table Lamp -->
  <g filter="url(#glow-h)" transform="translate(190, 80)">
    <!-- Shade -->
    <path d="M30 40 L90 40 L105 100 L15 100 Z" fill="url(#lamp-warm)" />
    <!-- Light Glow -->
    <ellipse cx="60" cy="100" rx="45" ry="12" fill="#fef08a" opacity="0.6" />
    <!-- Base -->
    <rect x="56" y="100" width="8" height="50" fill="#78350f" rx="4" />
    <ellipse cx="60" cy="150" rx="35" ry="8" fill="#78350f" />
  </g>
  <!-- Sparkles -->
  <circle cx="95" cy="70" r="3" fill="#fef3c7" />
  <circle cx="310" cy="85" r="3.5" fill="#fef3c7" />
</svg>