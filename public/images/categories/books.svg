<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="book-spine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="book-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow-b" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <ellipse cx="200" cy="240" rx="130" ry="22" fill="#000000" opacity="0.3" filter="blur(8px)" />
  <!-- Bottom Book -->
  <g filter="url(#glow-b)">
    <rect x="70" y="195" width="260" height="34" rx="6" fill="#134e4a" />
    <path d="M70 200 Q200 205 330 200 L330 222 Q200 227 70 222 Z" fill="#f8fafc" />
    <rect x="66" y="195" width="16" height="34" rx="4" fill="url(#book-spine)" />
    <rect x="140" y="209" width="120" height="4" rx="2" fill="url(#book-gold)" />
  </g>
  <!-- Middle Book -->
  <g filter="url(#glow-b)" transform="rotate(-4 190 170)">
    <rect x="90" y="155" width="230" height="32" rx="6" fill="#065f46" />
    <path d="M90 160 Q195 165 320 160 L320 180 Q195 185 90 180 Z" fill="#e2e8f0" />
    <rect x="86" y="155" width="16" height="32" rx="4" fill="#10b981" />
  </g>
  <!-- Top Standing Book -->
  <g filter="url(#glow-b)" transform="rotate(12 210 120)">
    <rect x="140" y="70" width="140" height="130" rx="8" fill="#047857" />
    <rect x="146" y="76" width="128" height="118" rx="6" fill="#064e3b" stroke="url(#book-gold)" stroke-width="2" />
    <circle cx="210" cy="125" r="28" fill="url(#book-gold)" opacity="0.85" />
    <path d="M200 120 L220 120 M210 110 L210 135" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <rect x="136" y="70" width="12" height="130" rx="3" fill="#34d399" />
  </g>
  <!-- Sparkles -->
  <circle cx="90" cy="90" r="3" fill="#fef08a" />
  <circle cx="310" cy="70" r="4" fill="#fef08a" />
  <circle cx="330" cy="140" r="2.5" fill="#fef08a" />
</svg>